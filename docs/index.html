<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RealLife Inventory</title>
    <meta name="theme-color" content="#303030" />
    <meta
      name="description"
      content="Ein spielerisches Inventar fuer echte Sachen, Lieblingsitems und ein eigenes Museum."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./app-icon.png" />
    <link rel="apple-touch-icon" href="./app-icon.png" />
    <style>
      :root {
        color-scheme: light;
        --blue: #303030;
        --blue-dark: #111111;
        --cyan: #8f8f8f;
        --gold: #f39a2b;
        --bg: #eeeeee;
        --surface: #ffffff;
        --surface-2: #f6f6f6;
        --slot: #fafafa;
        --line: #d2d2d2;
        --ink: #111111;
        --muted: #646464;
        --pack: #d6ad91;
        --shadow: 0 14px 28px rgba(0, 0, 0, 0.1);
        --slot-size: 62px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        background: #ededed;
        color: var(--ink);
        cursor: pointer;
        font-weight: 820;
        touch-action: manipulation;
      }

      button:active,
      .slot:active,
      .nav-btn:active {
        transform: translateY(1px) scale(0.99);
      }

      .primary {
        background: linear-gradient(135deg, #111111, #545454);
        color: white;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.16);
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface-2);
        color: var(--ink);
        padding: 12px 14px;
        outline: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.08);
      }

      .app {
        width: min(540px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 12px 12px 94px;
      }

      .topbar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .avatar {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        overflow: hidden;
        border: 3px solid white;
        border-radius: 13px;
        background: rgba(232, 242, 255, 0.9);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.16);
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .brand-title {
        margin: 0;
        font-size: 1.58rem;
        line-height: 1;
        letter-spacing: 0;
      }

      .brand-sub {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 750;
      }

      .coin {
        display: inline-grid;
        grid-template-columns: auto auto;
        gap: 6px;
        align-items: center;
        min-height: 38px;
        padding: 0 12px;
        border-radius: 12px;
        background: #111111;
        color: white;
        font-weight: 950;
      }

      .screen {
        display: none;
        gap: 12px;
        margin-top: 12px;
      }

      .screen.active {
        display: grid;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow);
      }

      .toolbar,
      .inventory-shell,
      .museum-stage,
      .form,
      .customizer {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .form-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }

      .form-head strong {
        font-size: 1.1rem;
      }

      .form-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .search-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      .search-row.hidden {
        display: none;
      }

      .search-toggle {
        font-size: 1.2rem;
      }

      .toolbar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .toolbar-head strong {
        font-size: 1rem;
      }

      .category-row {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(68px, 1fr);
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }

      .category-row::-webkit-scrollbar {
        display: none;
      }

      .chip {
        display: grid;
        min-height: 56px;
        place-items: center;
        gap: 2px;
        padding: 8px 6px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--surface);
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 850;
      }

      .chip strong {
        display: grid;
        width: 30px;
        height: 24px;
        place-items: center;
        border-radius: 8px;
        background: #f0f0f0;
        color: var(--ink);
        font-size: 0.68rem;
        line-height: 1;
        letter-spacing: 0;
      }

      .chip.active {
        border-color: transparent;
        background: linear-gradient(135deg, #111111, #4f4f4f);
        color: white;
        box-shadow: 0 10px 18px rgba(22, 119, 255, 0.22);
      }

      .chip.active strong {
        background: rgba(255, 255, 255, 0.18);
        color: white;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .tabs.single {
        grid-template-columns: 1fr;
      }

      .tab-pill {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--surface-2);
        color: var(--muted);
        font-weight: 900;
      }

      .tab-pill.active {
        border-color: transparent;
        background: #111111;
        color: white;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--slot-size), 1fr));
        gap: 8px;
      }

      .slot {
        position: relative;
        display: grid;
        min-height: var(--slot-size);
        aspect-ratio: 1;
        place-items: center;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 12px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(238, 238, 238, 0.94)),
          var(--slot);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.82),
          inset 0 -6px 0 rgba(0, 0, 0, 0.04);
        transition:
          transform 150ms ease,
          box-shadow 150ms ease,
          border-color 150ms ease;
      }

      .slot.empty {
        background:
          linear-gradient(rgba(0, 0, 0, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 0, 0, 0.06) 1px, transparent 1px),
          rgba(255, 255, 255, 0.62);
        background-size: 18px 18px;
        color: #9a9a9a;
        font-size: 1.15rem;
        font-weight: 850;
      }

      .slot.selected {
        border-color: var(--gold);
        box-shadow:
          0 0 0 3px rgba(255, 200, 61, 0.32),
          0 12px 24px rgba(22, 119, 255, 0.14);
      }

      .slot-icon {
        display: grid;
        width: 58%;
        aspect-ratio: 1;
        place-items: center;
        border: 2px solid #111111;
        border-radius: 13px;
        background:
          linear-gradient(145deg, var(--pack), #9f755f);
        color: white;
        font-size: calc(var(--slot-size) * 0.18);
        font-weight: 950;
        letter-spacing: 0;
        text-transform: uppercase;
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.16);
      }

      .slot-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .star {
        position: absolute;
        right: 7px;
        top: 7px;
        display: grid;
        min-width: 28px;
        height: 20px;
        padding: 0 6px;
        place-items: center;
        border-radius: 999px;
        background: white;
        color: var(--gold);
        font-size: 0.62rem;
        font-weight: 950;
        box-shadow: 0 6px 12px rgba(14, 36, 64, 0.14);
      }

      .empty-note {
        display: grid;
        gap: 8px;
        place-items: center;
        min-height: 220px;
        padding: 22px;
        text-align: center;
      }

      .empty-note strong {
        padding: 8px 12px;
        border-radius: 10px;
        background: var(--ink);
        color: white;
        font-size: 0.82rem;
        letter-spacing: 0;
      }

      .empty-note p {
        max-width: 18rem;
        margin: 0;
        color: var(--muted);
        font-weight: 750;
      }

      .detail-card {
        position: sticky;
        bottom: 84px;
        z-index: 4;
        display: none;
        grid-template-columns: 86px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 18px 42px rgba(14, 36, 64, 0.18);
      }

      .detail-card.show {
        display: grid;
      }

      .detail-art {
        display: grid;
        height: 76px;
        place-items: center;
        overflow: hidden;
        border-radius: 12px;
        background: var(--surface-2);
        font-size: 1rem;
        font-weight: 950;
      }

      .detail-art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .detail-card h2 {
        margin: 0;
        font-size: 1.08rem;
      }

      .detail-card p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 720;
      }

      .detail-actions {
        display: grid;
        gap: 7px;
      }

      .icon-btn {
        display: grid;
        width: 46px;
        min-height: 44px;
        place-items: center;
        padding: 0;
        font-size: 0.72rem;
        font-weight: 950;
      }

      .showcase {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .pedestal {
        display: grid;
        min-height: 150px;
        place-items: center;
        padding: 12px;
        border: 1px solid rgba(255, 200, 61, 0.48);
        border-radius: 16px;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 200, 61, 0.28), transparent 42%),
          linear-gradient(180deg, #ffffff 0%, #fff7dc 100%);
        box-shadow: 0 14px 28px rgba(255, 200, 61, 0.18);
      }

      .pedestal .slot {
        width: 88px;
      }

      .pedestal-name {
        margin-top: 8px;
        color: var(--blue-dark);
        font-size: 0.82rem;
        font-weight: 900;
        text-align: center;
      }

      .museum-add {
        display: grid;
        min-height: 150px;
        place-items: center;
        gap: 4px;
        border: 1px dashed var(--line);
        border-radius: 16px;
        background: var(--surface-2);
        color: var(--muted);
        font-weight: 850;
      }

      .museum-add strong {
        font-size: 1.6rem;
      }

      .museum-picker {
        width: min(430px, calc(100% - 24px));
        max-height: min(620px, calc(100vh - 48px));
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        color: var(--ink);
      }

      .museum-picker::backdrop {
        background: rgba(0, 0, 0, 0.52);
      }

      .museum-picker-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .museum-picker-list {
        display: grid;
        gap: 8px;
        overflow-y: auto;
      }

      .museum-choice {
        display: grid;
        grid-template-columns: 52px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-2);
        color: var(--ink);
        text-align: left;
      }

      .museum-choice img {
        width: 52px;
        height: 52px;
        object-fit: contain;
        border-radius: 8px;
        background: var(--slot);
      }

      .photo-background-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }

      .photo-background-row input[type="color"] {
        width: 44px;
        height: 36px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .photo-box {
        position: relative;
        display: grid;
        min-height: 260px;
        overflow: hidden;
        place-items: center;
        border: 2px dashed #a9cffc;
        border-radius: 16px;
        background: #f4f4f4;
      }

      .photo-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .photo-box span {
        display: grid;
        place-items: center;
        gap: 8px;
        color: var(--muted);
        font-weight: 850;
      }

      .photo-box span strong {
        display: grid;
        width: 64px;
        height: 48px;
        place-items: center;
        border-radius: 12px;
        background: var(--ink);
        color: white;
        font-size: 0.82rem;
        letter-spacing: 0;
      }

      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .switch-line {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        align-items: center;
        color: var(--muted);
        font-weight: 850;
      }

      .switch-line input {
        width: 22px;
        height: 22px;
      }

      .palette-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .profile-editor {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 12px;
        align-items: center;
      }

      .profile-preview {
        display: grid;
        width: 72px;
        height: 72px;
        place-items: center;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #eeeeee;
      }

      .profile-preview img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .palette-control {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
        align-items: center;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-2);
        color: var(--ink);
        font-size: 12px;
        font-weight: 800;
      }

      .palette-control input[type="color"] {
        width: 34px;
        height: 28px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
      }

      input[type="range"] {
        padding: 0;
      }

      .bottom-nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: 0.82fr 1.32fr 0.82fr;
        gap: 8px;
        width: min(540px, 100%);
        margin: 0 auto;
        padding: 8px 10px 10px;
        border-top: 1px solid rgba(216, 232, 251, 0.9);
        border-radius: 18px 18px 0 0;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 -14px 30px rgba(14, 36, 64, 0.14);
        backdrop-filter: blur(16px);
      }

      .nav-btn {
        display: grid;
        min-height: 58px;
        place-items: center;
        gap: 2px;
        border-radius: 13px;
        background: transparent;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 900;
      }

      .nav-btn.main-tab {
        min-height: 70px;
        transform: translateY(-10px);
        border: 4px solid white;
        border-radius: 18px;
      }

      .nav-btn span {
        font-size: 0.95rem;
        font-weight: 950;
        line-height: 1;
      }

      .nav-btn img {
        width: 30px;
        height: 30px;
        object-fit: contain;
        image-rendering: pixelated;
      }

      .nav-btn.active {
        background: linear-gradient(135deg, #111111, #555555);
        color: white;
        box-shadow: 0 10px 20px rgba(22, 119, 255, 0.22);
      }

      .nav-btn.main-tab span {
        font-size: 1.05rem;
      }

      .photo-add-button img {
        width: 22px;
        height: 22px;
        vertical-align: middle;
        image-rendering: pixelated;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 390px) {
        :root {
          --slot-size: 68px;
        }

        .brand-title {
          font-size: 1.5rem;
        }

        .showcase {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <button class="avatar" id="avatarButton" type="button" title="Profil bearbeiten">
          <img id="avatarImage" alt="Profilbild" src="./profile-default.png" />
        </button>
        <div>
          <h1 class="brand-title" id="profileNameText">RealLife</h1>
          <p class="brand-sub" id="playerLine">Level 1 · 0 Sachen</p>
        </div>
        <div class="coin"><span>XP</span><span id="scoreText">0</span></div>
      </header>

      <section class="screen active" id="inventoryScreen">
        <div class="panel toolbar">
          <div class="toolbar-head">
            <strong>Sammlung</strong>
            <div>
              <button class="icon-btn search-toggle" id="searchToggleButton" type="button" title="Inventar durchsuchen">⌕</button>
              <button class="icon-btn" id="customizeButton" type="button" title="Anpassen">⚙</button>
            </div>
          </div>
          <div class="search-row hidden" id="searchRow">
            <input id="searchInput" type="search" placeholder="Item suchen" />
            <button class="icon-btn" id="clearSearchButton" type="button" title="Suche leeren">×</button>
          </div>
          <div class="category-row" id="categoryRow"></div>
          <button class="secondary" id="addCategoryButton" type="button">+ Kategorie</button>
        </div>

        <div class="panel inventory-shell">
          <div class="tabs single">
            <button class="tab-pill active" type="button">
              <span>INV</span><span>Meine Sachen</span>
            </button>
          </div>
          <div class="grid" id="itemGrid"></div>
          <div class="empty-note hidden" id="emptyNote">
            <strong>EMPTY</strong>
            <p>Noch leer. Fueg dein erstes Item hinzu.</p>
            <button class="primary" type="button" data-nav="photo">Item anlegen</button>
          </div>
        </div>

        <div class="panel museum-stage">
          <div class="tabs">
            <button class="tab-pill active" type="button">
              <span>MUS</span><span>Museum</span>
            </button>
            <button class="tab-pill" id="museumStyleButton" type="button">
              <span>+</span><span>Platzieren</span>
            </button>
          </div>
          <div class="showcase" id="museumGrid"></div>
          <div class="empty-note hidden" id="museumEmpty">
            <strong>MUSEUM</strong>
            <p>Waehle einen Platz und stelle ein Item aus deinem Inventar hinein.</p>
          </div>
        </div>
      </section>

      <section class="screen" id="marketScreen">
        <div class="panel inventory-shell">
          <div class="tabs">
            <button class="tab-pill active" type="button">
              <span>MKT</span><span>Market</span>
            </button>
            <button class="tab-pill" type="button" data-nav="inventory">
              <span>INV</span><span>Zurueck</span>
            </button>
          </div>
          <div class="empty-note">
            <strong>MKT</strong>
            <p>Market kommt spaeter. Hier koennen mal Tausch, Wunschliste oder Preise rein.</p>
          </div>
        </div>
      </section>

      <section class="screen" id="photoScreen">
        <form class="panel form" id="itemForm">
          <div class="form-head">
            <strong id="formTitle">Neues Item</strong>
            <button class="icon-btn hidden" id="cancelEditButton" type="button" title="Bearbeiten abbrechen">↩</button>
          </div>
          <div class="photo-box" id="photoBox">
            <span><strong>ITEM</strong>Foto oder Datei</span>
            <img class="hidden" id="previewImage" alt="Item Foto" />
          </div>
          <input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden" />
          <button class="primary photo-add-button" id="photoButton" type="button"><img src="./add-icon.png" alt="" /> Foto aufnehmen</button>
          <label class="photo-background-row">
            <span>Hintergrundfarbe</span>
            <input id="photoBackgroundInput" type="color" value="#eeeeee" aria-label="Hintergrundfarbe des Items" />
          </label>

          <input id="nameInput" required maxlength="28" placeholder="Name vom Item" />
          <div class="two-col">
            <select id="categoryInput"></select>
            <select id="rarityInput" aria-label="Seltenheit">
              <option value="Common">Common</option>
              <option value="Uncommon">Uncommon</option>
              <option value="Rare">Rare</option>
              <option value="Epic">Epic</option>
              <option value="Legendary">Legendary</option>
              <option value="Mythic">Mythic</option>
              <option value="Secret">Secret</option>
            </select>
          </div>
          <input id="dateInput" type="month" aria-label="Seit wann" />
          <textarea id="noteInput" rows="2" maxlength="90" placeholder="Kurze Info"></textarea>
          <div class="form-actions">
            <button type="button" id="clearFormButton">Leeren</button>
            <button class="primary" id="submitItemButton" type="submit">Speichern</button>
          </div>
        </form>
      </section>

      <dialog class="museum-picker" id="museumPicker">
        <div class="museum-picker-head">
          <strong>Item ins Museum</strong>
          <button class="icon-btn" id="closeMuseumPickerButton" type="button" title="Schliessen">×</button>
        </div>
        <div class="museum-picker-list" id="museumPickerList"></div>
      </dialog>

      <section class="screen" id="customizeScreen">
        <div class="panel customizer">
          <div class="tabs">
            <button class="tab-pill active" type="button">
              <span>CFG</span><span>Anpassen</span>
            </button>
          </div>
          <div class="profile-editor">
            <button class="profile-preview" id="profilePhotoButton" type="button" title="Profilbild hochladen">
              <img id="profilePreviewImage" alt="Profilbild Vorschau" src="./profile-default.png" />
            </button>
            <div>
              <input id="nicknameInput" maxlength="18" placeholder="Profilname" />
              <button id="resetProfilePhotoButton" type="button" style="margin-top: 8px; width: 100%">Default Bild</button>
            </div>
          </div>
          <input id="profilePhotoInput" type="file" accept="image/*" class="hidden" />
          <div class="palette-grid" id="paletteGrid"></div>
          <button type="button" id="resetPaletteButton" style="width: 100%; margin-top: 10px">Farben zuruecksetzen</button>
        </div>
      </section>

      <article class="detail-card" id="detailCard"></article>
    </main>

    <nav class="bottom-nav" aria-label="Navigation">
      <button class="nav-btn" type="button" data-nav="market"><span>MKT</span>Market</button>
      <button class="nav-btn main-tab active" type="button" data-nav="inventory">
        <img src="./backpack-icon.png" alt="" />
        Inventar
      </button>
      <button class="nav-btn" type="button" data-nav="photo">
        <img src="./add-icon.png" alt="" />
        Foto
      </button>
    </nav>

    <script>
      const STORAGE_KEY = "reallife-game-inventory-v4";
      const STYLE_KEY = "reallife-game-style-v2";
      const CATEGORY_KEY = "reallife-game-categories-v1";
      const MUSEUM_KEY = "reallife-game-museum-v1";
      const DEFAULT_PROFILE_IMAGE = "./profile-default.png";
      const defaultCategories = [
        { id: "all", label: "Alle", icon: "ALL" },
        { id: "lifestyle", label: "Style", icon: "ST" },
        { id: "tech", label: "Tech", icon: "GX" },
        { id: "school", label: "Schule", icon: "SC" },
        { id: "fun", label: "Freizeit", icon: "FR" },
        { id: "collect", label: "Sammeln", icon: "TC" },
        { id: "other", label: "Anderes", icon: "ET" }
      ];
      let categories = loadCategories();
      const DEFAULT_PALETTE = {
        blue: "#303030", blueDark: "#111111", cyan: "#8f8f8f", gold: "#f39a2b",
        bg: "#eeeeee", surface: "#ffffff", surface2: "#f6f6f6", slot: "#fafafa",
        line: "#d2d2d2", ink: "#111111", muted: "#646464", pack: "#d6ad91"
      };
      let items = loadItems();
      let selectedId = null;
      let editingId = null;
      let activeCategory = "all";
      let searchTerm = "";
      let museumSlots = loadMuseumSlots();
      let currentPhoto = "";
      let settings = loadSettings();

      const screens = {
        inventory: document.querySelector("#inventoryScreen"),
        market: document.querySelector("#marketScreen"),
        photo: document.querySelector("#photoScreen"),
        customize: document.querySelector("#customizeScreen")
      };
      const itemGrid = document.querySelector("#itemGrid");
      const museumGrid = document.querySelector("#museumGrid");
      const emptyNote = document.querySelector("#emptyNote");
      const museumEmpty = document.querySelector("#museumEmpty");
      const detailCard = document.querySelector("#detailCard");
      const categoryRow = document.querySelector("#categoryRow");
      const categoryInput = document.querySelector("#categoryInput");
      const photoInput = document.querySelector("#photoInput");
      const previewImage = document.querySelector("#previewImage");
      const photoBox = document.querySelector("#photoBox");
      const profilePhotoInput = document.querySelector("#profilePhotoInput");
      const itemForm = document.querySelector("#itemForm");
      const formTitle = document.querySelector("#formTitle");
      const submitItemButton = document.querySelector("#submitItemButton");
      const cancelEditButton = document.querySelector("#cancelEditButton");
      const photoBackgroundInput = document.querySelector("#photoBackgroundInput");
      const museumPicker = document.querySelector("#museumPicker");
      const museumPickerList = document.querySelector("#museumPickerList");

      function itemSeed(name, category, icon, rarity, note, favorite) {
        return {
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
          name,
          category,
          icon,
          rarity,
          note,
          favorite,
          date: "2026-08",
          photo: ""
        };
      }

      function loadItems() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch {
          return [];
        }
      }

      function loadCategories() {
        try {
          return [...defaultCategories, ...(JSON.parse(localStorage.getItem(CATEGORY_KEY)) || [])];
        } catch {
          return [...defaultCategories];
        }
      }

      function loadMuseumSlots() {
        try {
          const saved = JSON.parse(localStorage.getItem(MUSEUM_KEY));
          return Array.isArray(saved) ? [...saved.slice(0, 4), ...Array(4).fill(null)].slice(0, 4) : [null, null, null, null];
        } catch {
          return [null, null, null, null];
        }
      }

      function saveMuseumSlots() {
        localStorage.setItem(MUSEUM_KEY, JSON.stringify(museumSlots));
      }

      function loadSettings() {
        const fallback = {
          nickname: "",
          profilePhoto: DEFAULT_PROFILE_IMAGE,
          palette: { ...DEFAULT_PALETTE }
        };
        try {
          const raw = JSON.parse(localStorage.getItem(STYLE_KEY)) || {};
          const saved = { ...fallback, ...raw, palette: { ...DEFAULT_PALETTE, ...(raw.palette || {}) } };
          if (!saved.profilePhoto) saved.profilePhoto = DEFAULT_PROFILE_IMAGE;
          return saved;
        } catch {
          return fallback;
        }
      }

      function saveItems() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }

      function saveSettings() {
        localStorage.setItem(STYLE_KEY, JSON.stringify(settings));
      }

      function applySettings() {
        const cssVariables = {
          blue: "--blue", blueDark: "--blue-dark", cyan: "--cyan", gold: "--gold", bg: "--bg",
          surface: "--surface", surface2: "--surface-2", slot: "--slot", line: "--line",
          ink: "--ink", muted: "--muted", pack: "--pack"
        };
        Object.entries(cssVariables).forEach(([key, variable]) => {
          document.documentElement.style.setProperty(variable, settings.palette[key]);
        });
        document.documentElement.style.setProperty("--slot-size", "62px");
        document.querySelector("#profileNameText").textContent = settings.nickname || "RealLife";
        document.querySelector("#avatarImage").src = settings.profilePhoto || DEFAULT_PROFILE_IMAGE;
        document.querySelector("#profilePreviewImage").src = settings.profilePhoto || DEFAULT_PROFILE_IMAGE;
        document.querySelector("#nicknameInput").value = settings.nickname;
      }

      function categoryName(id) {
        return categories.find((category) => category.id === id)?.label || "Anderes";
      }

      function filteredItems() {
        return items.filter((item) => {
          const byCategory = activeCategory === "all" || item.category === activeCategory;
          const byName = !searchTerm || item.name.toLocaleLowerCase().includes(searchTerm);
          return byCategory && byName;
        }).sort((a, b) => a.name.localeCompare(b.name, "de", { sensitivity: "base" }));
      }

      function renderCategories() {
        categoryRow.innerHTML = categories
          .map((category) => `
            <button class="chip ${category.id === activeCategory ? "active" : ""}" type="button" data-category="${category.id}">
              <strong>${category.icon}</strong>
              <span>${category.label}</span>
            </button>
          `)
          .join("");
        categoryInput.innerHTML = categories
          .filter((category) => category.id !== "all")
          .map((category) => `<option value="${category.id}">${category.label}</option>`)
          .join("");
      }

      function slotMarkup(item, extraClass = "") {
        if (!item) return `<button class="slot empty ${extraClass}" type="button" data-nav="photo">+</button>`;
        const art = item.photo
          ? `<img class="slot-photo" src="${item.photo}" alt="${escapeHtml(item.name)}" />`
          : `<span class="slot-icon">${item.icon || "IT"}</span>`;
        return `
          <button class="slot ${selectedId === item.id ? "selected" : ""} ${extraClass}" type="button" data-item="${item.id}" style="background-color: ${item.backgroundColor || "var(--slot)"}">
            ${art}
          </button>
        `;
      }

      function renderInventory() {
        const shown = filteredItems();
        itemGrid.innerHTML = shown.map((item) => slotMarkup(item)).join("");
        const emptySlots = Math.max(12 - shown.length, shown.length ? 0 : 8);
        itemGrid.insertAdjacentHTML("beforeend", Array.from({ length: emptySlots }, () => slotMarkup()).join(""));
        emptyNote.classList.toggle("hidden", items.length !== 0);
        document.querySelector("#scoreText").textContent = String(items.length * 10);
        document.querySelector("#playerLine").textContent = `${settings.nickname || "Level 1"} · ${items.length} Sachen`;
      }

      function renderMuseum() {
        museumGrid.innerHTML = museumSlots.map((itemId, index) => {
          const item = items.find((entry) => entry.id === itemId);
          if (!item) return `<button class="museum-add" type="button" data-museum-slot="${index}"><strong>+</strong><span>Hinzufuegen</span></button>`;
          const art = item.photo
            ? `<img class="slot-photo" src="${item.photo}" alt="${escapeHtml(item.name)}" />`
            : `<span class="slot-icon">${item.icon || "IT"}</span>`;
          return `<button class="pedestal" type="button" data-item="${item.id}" data-museum-slot="${index}"><span class="slot museum-slot">${art}</span><div class="pedestal-name">${escapeHtml(item.name)}</div></button>`;
        }).join("");
        museumEmpty.classList.add("hidden");
      }

      function renderMuseumPicker() {
        const choices = [...items].sort((a, b) => a.name.localeCompare(b.name, "de", { sensitivity: "base" }));
        museumPickerList.innerHTML = choices.length ? choices.map((item) => {
          const art = item.photo ? `<img src="${item.photo}" alt="" />` : `<span class="slot-icon">${item.icon || "IT"}</span>`;
          return `<button class="museum-choice" type="button" data-choice-item="${item.id}">${art}<strong>${escapeHtml(item.name)}</strong><span>${escapeHtml(item.rarity)}</span></button>`;
        }).join("") : `<p class="empty-note">Dein Inventar ist noch leer.</p>`;
      }

      function openMuseumPicker(slotIndex) {
        museumPicker.dataset.slotIndex = String(slotIndex);
        renderMuseumPicker();
        museumPicker.showModal();
      }

      function renderPalette() {
        const labels = {
          blue: "Hauptfarbe", blueDark: "Dunkel", cyan: "Akzent", gold: "Highlight",
          bg: "Hintergrund", surface: "Panel", surface2: "Felder", slot: "Slots",
          line: "Linien", ink: "Text", muted: "Neben-Text", pack: "Item-Akzent"
        };
        document.querySelector("#paletteGrid").innerHTML = Object.entries(labels)
          .map(([key, label]) => `<label class="palette-control"><span>${label}</span><input type="color" value="${settings.palette[key]}" data-palette="${key}" aria-label="${label}" /></label>`)
          .join("");
      }

      function renderDetail() {
        const item = items.find((entry) => entry.id === selectedId);
        if (!item) {
          detailCard.classList.remove("show");
          detailCard.innerHTML = "";
          return;
        }
        const art = item.photo
          ? `<img src="${item.photo}" alt="${escapeHtml(item.name)}" />`
          : `<span class="slot-icon">${item.icon || "IT"}</span>`;
        detailCard.innerHTML = `
          <div class="detail-art">${art}</div>
          <div>
            <h2>${escapeHtml(item.name)}</h2>
            <p>${categoryName(item.category)} · ${item.rarity}</p>
            <p>${escapeHtml(item.note || "Keine Info")}</p>
          </div>
          <div class="detail-actions">
            <button class="icon-btn" type="button" data-action="edit">✎</button>
            <button class="icon-btn" type="button" data-action="museum">MUS</button>
            <button class="icon-btn" type="button" data-action="delete">✕</button>
          </div>
        `;
        detailCard.classList.add("show");
      }

      function renderAll() {
        renderCategories();
        applySettings();
        renderInventory();
        renderMuseum();
        renderDetail();
      }

      function selectItem(id) {
        selectedId = id;
        renderAll();
      }

      function resetItemForm() {
        editingId = null;
        itemForm.reset();
        document.querySelector("#rarityInput").value = "Common";
        photoBackgroundInput.value = "#eeeeee";
        currentPhoto = "";
        photoBox.style.backgroundColor = "#eeeeee";
        previewImage.removeAttribute("src");
        previewImage.classList.add("hidden");
        photoBox.querySelector("span").classList.remove("hidden");
        formTitle.textContent = "Neues Item";
        submitItemButton.textContent = "Speichern";
        cancelEditButton.classList.add("hidden");
      }

      function startEditItem(id) {
        const item = items.find((entry) => entry.id === id);
        if (!item) return;
        editingId = id;
        selectedId = id;
        document.querySelector("#nameInput").value = item.name;
        document.querySelector("#categoryInput").value = item.category;
        document.querySelector("#dateInput").value = item.date || "";
        document.querySelector("#rarityInput").value = item.rarity;
        document.querySelector("#noteInput").value = item.note || "";
        photoBackgroundInput.value = item.backgroundColor || "#eeeeee";
        currentPhoto = item.photo || "";
        photoBox.style.backgroundColor = item.backgroundColor || "#eeeeee";
        if (currentPhoto) {
          previewImage.src = currentPhoto;
          previewImage.classList.remove("hidden");
          photoBox.querySelector("span").classList.add("hidden");
        } else {
          previewImage.removeAttribute("src");
          previewImage.classList.add("hidden");
          photoBox.querySelector("span").classList.remove("hidden");
        }
        formTitle.textContent = "Item bearbeiten";
        submitItemButton.textContent = "Update";
        cancelEditButton.classList.remove("hidden");
        showScreen("photo");
      }

      function showScreen(name) {
        Object.entries(screens).forEach(([key, screen]) => {
          screen.classList.toggle("active", key === name);
        });
        document.querySelectorAll(".nav-btn").forEach((button) => {
          button.classList.toggle("active", button.dataset.nav === name);
        });
        if (name === "photo" && !editingId) {
          resetItemForm();
        }
        if (name !== "inventory" && !editingId) {
          selectedId = null;
          renderDetail();
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function removePhotoBackground(dataUrl) {
        return new Promise((resolve) => {
          const image = new Image();
          image.onload = () => {
            const canvas = document.createElement("canvas");
            const scale = Math.min(1, 720 / Math.max(image.naturalWidth, image.naturalHeight));
            canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
            const context = canvas.getContext("2d", { willReadFrequently: true });
            context.drawImage(image, 0, 0);
            const pixels = context.getImageData(0, 0, canvas.width, canvas.height);
            const { data, width, height } = pixels;
            const visited = new Uint8Array(width * height);
            const queue = new Int32Array(width * height);
            let head = 0;
            let tail = 0;
            const addEdgePixel = (x, y) => {
              const pixel = y * width + x;
              if (visited[pixel]) return;
              visited[pixel] = 1;
              queue[tail++] = pixel;
            };
            for (let x = 0; x < width; x += 1) {
              addEdgePixel(x, 0);
              addEdgePixel(x, height - 1);
            }
            for (let y = 1; y < height - 1; y += 1) {
              addEdgePixel(0, y);
              addEdgePixel(width - 1, y);
            }
            while (head < tail) {
              const pixel = queue[head++];
              const x = pixel % width;
              const y = Math.floor(pixel / width);
              const source = pixel * 4;
              data[source + 3] = 0;
              [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]].forEach(([nextX, nextY]) => {
                if (nextX < 0 || nextY < 0 || nextX >= width || nextY >= height) return;
                const nextPixel = nextY * width + nextX;
                if (visited[nextPixel]) return;
                const next = nextPixel * 4;
                const distance = Math.hypot(data[next] - data[source], data[next + 1] - data[source + 1], data[next + 2] - data[source + 2]);
                if (distance < 58) {
                  visited[nextPixel] = 1;
                  queue[tail++] = nextPixel;
                }
              });
            }
            context.putImageData(pixels, 0, 0);
            resolve(canvas.toDataURL("image/png"));
          };
          image.onerror = () => resolve(dataUrl);
          image.src = dataUrl;
        });
      }

      document.addEventListener("click", (event) => {
        const nav = event.target.closest("[data-nav]");
        if (nav) {
          if (nav.dataset.nav === "photo") resetItemForm();
          showScreen(nav.dataset.nav);
          return;
        }

        const museumSlot = event.target.closest("[data-museum-slot]");
        if (museumSlot) {
          openMuseumPicker(Number(museumSlot.dataset.museumSlot));
          return;
        }

        const museumChoice = event.target.closest("[data-choice-item]");
        if (museumChoice) {
          museumSlots[Number(museumPicker.dataset.slotIndex)] = museumChoice.dataset.choiceItem;
          saveMuseumSlots();
          museumPicker.close();
          renderMuseum();
          return;
        }

        const category = event.target.closest("[data-category]");
        if (category) {
          activeCategory = category.dataset.category;
          renderAll();
          return;
        }

        const action = event.target.closest("[data-action]");
        if (action && selectedId) {
          if (action.dataset.action === "edit") {
            startEditItem(selectedId);
            return;
          }
          if (action.dataset.action === "museum") {
            const existingIndex = museumSlots.indexOf(selectedId);
            if (existingIndex >= 0) {
              museumSlots[existingIndex] = null;
            } else {
              const emptyIndex = museumSlots.indexOf(null);
              if (emptyIndex < 0) {
                window.alert("Das Museum hat nur vier Plaetze.");
                return;
              }
              museumSlots[emptyIndex] = selectedId;
            }
            saveMuseumSlots();
          }
          if (action.dataset.action === "delete") {
            items = items.filter((item) => item.id !== selectedId);
            museumSlots = museumSlots.map((itemId) => itemId === selectedId ? null : itemId);
            saveMuseumSlots();
            selectedId = null;
          }
          saveItems();
          renderAll();
          return;
        }

        const itemButton = event.target.closest("[data-item]");
        if (itemButton) {
          selectItem(itemButton.dataset.item);
          return;
        }

      });

      document.querySelector("#customizeButton").addEventListener("click", () => showScreen("customize"));
      document.querySelector("#museumStyleButton").addEventListener("click", () => openMuseumPicker(0));
      document.querySelector("#closeMuseumPickerButton").addEventListener("click", () => museumPicker.close());
      document.querySelector("#searchToggleButton").addEventListener("click", () => {
        const row = document.querySelector("#searchRow");
        row.classList.toggle("hidden");
        if (!row.classList.contains("hidden")) document.querySelector("#searchInput").focus();
      });
      document.querySelector("#searchInput").addEventListener("input", (event) => {
        searchTerm = event.target.value.trim().toLocaleLowerCase();
        renderInventory();
      });
      document.querySelector("#clearSearchButton").addEventListener("click", () => {
        searchTerm = "";
        document.querySelector("#searchInput").value = "";
        renderInventory();
      });
      document.querySelector("#addCategoryButton").addEventListener("click", () => {
        const label = window.prompt("Name der neuen Kategorie");
        const cleanLabel = label?.trim();
        if (!cleanLabel) return;
        const id = cleanLabel.toLocaleLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || `category-${Date.now()}`;
        if (categories.some((category) => category.id === id)) return;
        const custom = { id, label: cleanLabel, icon: "++" };
        categories.push(custom);
        localStorage.setItem(CATEGORY_KEY, JSON.stringify(categories.filter((category) => !defaultCategories.some((base) => base.id === category.id))));
        renderCategories();
        categoryInput.value = id;
      });
      document.querySelector("#photoButton").addEventListener("click", () => photoInput.click());
      document.querySelector("#avatarButton").addEventListener("click", () => showScreen("customize"));
      document.querySelector("#profilePhotoButton").addEventListener("click", () => profilePhotoInput.click());
      document.querySelector("#resetProfilePhotoButton").addEventListener("click", () => {
        settings.profilePhoto = DEFAULT_PROFILE_IMAGE;
        saveSettings();
        applySettings();
      });
      cancelEditButton.addEventListener("click", () => {
        resetItemForm();
        showScreen("inventory");
      });
      document.querySelector("#clearFormButton").addEventListener("click", resetItemForm);

      document.querySelector("#nicknameInput").addEventListener("input", (event) => {
        settings.nickname = event.target.value.trim();
        saveSettings();
        renderAll();
      });
      document.querySelector("#paletteGrid").addEventListener("input", (event) => {
        const input = event.target.closest("[data-palette]");
        if (!input) return;
        settings.palette[input.dataset.palette] = input.value;
        saveSettings();
        applySettings();
      });
      document.querySelector("#resetPaletteButton").addEventListener("click", () => {
        settings.palette = { ...DEFAULT_PALETTE };
        saveSettings();
        renderPalette();
        applySettings();
      });

      photoInput.addEventListener("change", () => {
        const file = photoInput.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          currentPhoto = await removePhotoBackground(String(reader.result));
          previewImage.src = currentPhoto;
          photoBox.style.backgroundColor = photoBackgroundInput.value;
          previewImage.classList.remove("hidden");
          photoBox.querySelector("span").classList.add("hidden");
        };
        reader.readAsDataURL(file);
      });
      photoBackgroundInput.addEventListener("input", () => {
        photoBox.style.backgroundColor = photoBackgroundInput.value;
      });

      profilePhotoInput.addEventListener("change", () => {
        const file = profilePhotoInput.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          settings.profilePhoto = String(reader.result);
          saveSettings();
          applySettings();
        };
        reader.readAsDataURL(file);
      });

      document.querySelector("#itemForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const original = items.find((item) => item.id === editingId);
        const formItem = {
          ...(original || {}),
          id: editingId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
          name: document.querySelector("#nameInput").value.trim(),
          category: document.querySelector("#categoryInput").value,
          date: document.querySelector("#dateInput").value || "",
          rarity: document.querySelector("#rarityInput").value,
          note: document.querySelector("#noteInput").value.trim(),
          photo: currentPhoto,
          backgroundColor: photoBackgroundInput.value,
          icon: original?.icon || "IT"
        };
        items = editingId
          ? items.map((item) => item.id === editingId ? formItem : item)
          : [formItem, ...items];
        saveItems();
        selectedId = formItem.id;
        resetItemForm();
        selectedId = formItem.id;
        renderAll();
        showScreen("inventory");
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }

      renderPalette();
      renderAll();
    </script>
  </body>
</html>
