<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RealLife Inventory</title>
    <meta name="theme-color" content="#1677ff" />
    <meta
      name="description"
      content="Ein spielerisches Inventar fuer echte Sachen, Lieblingsitems und ein eigenes Museum."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <style>
      :root {
        color-scheme: light;
        --blue: #1677ff;
        --blue-dark: #0658d8;
        --cyan: #49bfff;
        --gold: #ffc83d;
        --bg: #eef7ff;
        --surface: #ffffff;
        --surface-2: #f5fbff;
        --slot: #f8fcff;
        --line: #d8e8fb;
        --ink: #0e2440;
        --muted: #6f8299;
        --shadow: 0 18px 38px rgba(22, 119, 255, 0.18);
        --slot-size: 78px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(73, 191, 255, 0.28), transparent 18rem),
          linear-gradient(180deg, #f9fdff 0%, var(--bg) 100%);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 16px;
        background: #e9f3ff;
        color: var(--ink);
        cursor: pointer;
        font-weight: 850;
        touch-action: manipulation;
      }

      button:active,
      .slot:active,
      .nav-btn:active {
        transform: translateY(1px) scale(0.99);
      }

      .primary {
        background: linear-gradient(135deg, var(--blue), var(--cyan));
        color: white;
        box-shadow: 0 12px 24px rgba(22, 119, 255, 0.26);
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface-2);
        color: var(--ink);
        padding: 12px 14px;
        outline: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(22, 119, 255, 0.11);
      }

      .app {
        width: min(540px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 12px 12px 94px;
      }

      .topbar {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .avatar {
        display: grid;
        width: 52px;
        height: 52px;
        place-items: center;
        border: 4px solid white;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--blue), var(--cyan));
        box-shadow: 0 10px 20px rgba(22, 119, 255, 0.24);
        color: white;
        font-size: 1.55rem;
      }

      .brand-title {
        margin: 0;
        font-size: 1.75rem;
        line-height: 1;
        letter-spacing: 0;
      }

      .brand-sub {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 750;
      }

      .coin {
        display: inline-grid;
        grid-template-columns: auto auto;
        gap: 6px;
        align-items: center;
        min-height: 38px;
        padding: 0 12px;
        border-radius: 999px;
        background: #0f63df;
        color: white;
        font-weight: 950;
      }

      .screen {
        display: none;
        gap: 12px;
        margin-top: 12px;
      }

      .screen.active {
        display: grid;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow);
      }

      .toolbar,
      .inventory-shell,
      .museum-stage,
      .form,
      .customizer {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .form-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
      }

      .form-head strong {
        font-size: 1.1rem;
      }

      .form-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .search-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      .category-row {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(68px, 1fr);
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }

      .category-row::-webkit-scrollbar {
        display: none;
      }

      .chip {
        display: grid;
        min-height: 62px;
        place-items: center;
        gap: 2px;
        padding: 8px 6px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 850;
      }

      .chip strong {
        font-size: 1.28rem;
        line-height: 1;
      }

      .chip.active {
        border-color: transparent;
        background: linear-gradient(135deg, var(--blue), var(--cyan));
        color: white;
        box-shadow: 0 10px 18px rgba(22, 119, 255, 0.22);
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .tab-pill {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface-2);
        color: var(--muted);
        font-weight: 900;
      }

      .tab-pill.active {
        border-color: transparent;
        background: var(--blue);
        color: white;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--slot-size), 1fr));
        gap: 8px;
      }

      .slot {
        position: relative;
        display: grid;
        min-height: var(--slot-size);
        aspect-ratio: 1;
        place-items: center;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 17px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.95), rgba(235, 246, 255, 0.9)),
          var(--slot);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.82);
        transition:
          transform 150ms ease,
          box-shadow 150ms ease,
          border-color 150ms ease;
      }

      .slot.empty {
        background:
          linear-gradient(rgba(22, 119, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 119, 255, 0.08) 1px, transparent 1px),
          rgba(255, 255, 255, 0.62);
        background-size: 18px 18px;
        color: #9dc5f6;
        font-size: 1.6rem;
      }

      body[data-slot-style="arcade"] .slot {
        border-width: 2px;
        border-radius: 12px;
        box-shadow:
          inset 0 -5px 0 rgba(14, 36, 64, 0.08),
          inset 0 0 0 2px white;
      }

      body[data-slot-style="clean"] .slot {
        border-radius: 10px;
        box-shadow: none;
      }

      .slot.selected {
        border-color: var(--gold);
        box-shadow:
          0 0 0 3px rgba(255, 200, 61, 0.32),
          0 12px 24px rgba(22, 119, 255, 0.14);
      }

      .slot-icon {
        max-width: 72%;
        max-height: 72%;
        object-fit: contain;
        font-size: calc(var(--slot-size) * 0.43);
        filter: drop-shadow(0 7px 9px rgba(14, 36, 64, 0.12));
      }

      .slot-photo {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .star {
        position: absolute;
        right: 7px;
        top: 7px;
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border-radius: 999px;
        background: white;
        color: var(--gold);
        font-size: 0.9rem;
        box-shadow: 0 6px 12px rgba(14, 36, 64, 0.14);
      }

      .count {
        position: absolute;
        right: 7px;
        bottom: 6px;
        color: var(--blue-dark);
        font-size: 0.78rem;
        font-weight: 950;
        text-shadow: 0 1px 0 white;
      }

      .empty-note {
        display: grid;
        gap: 8px;
        place-items: center;
        min-height: 220px;
        padding: 22px;
        text-align: center;
      }

      .empty-note strong {
        font-size: 3rem;
      }

      .empty-note p {
        max-width: 18rem;
        margin: 0;
        color: var(--muted);
        font-weight: 750;
      }

      .detail-card {
        position: sticky;
        bottom: 84px;
        z-index: 4;
        display: none;
        grid-template-columns: 86px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 18px 42px rgba(14, 36, 64, 0.18);
      }

      .detail-card.show {
        display: grid;
      }

      .detail-art {
        display: grid;
        height: 76px;
        place-items: center;
        overflow: hidden;
        border-radius: 18px;
        background: var(--surface-2);
        font-size: 2.1rem;
      }

      .detail-art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .detail-card h2 {
        margin: 0;
        font-size: 1.08rem;
      }

      .detail-card p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 720;
      }

      .detail-actions {
        display: grid;
        gap: 7px;
      }

      .icon-btn {
        display: grid;
        width: 44px;
        min-height: 44px;
        place-items: center;
        padding: 0;
        font-size: 1.1rem;
      }

      .showcase {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .pedestal {
        display: grid;
        min-height: 150px;
        place-items: center;
        padding: 12px;
        border: 1px solid rgba(255, 200, 61, 0.48);
        border-radius: 22px;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 200, 61, 0.28), transparent 42%),
          linear-gradient(180deg, #ffffff 0%, #fff7dc 100%);
        box-shadow: 0 14px 28px rgba(255, 200, 61, 0.18);
      }

      .pedestal .slot {
        width: 88px;
      }

      .pedestal-name {
        margin-top: 8px;
        color: var(--blue-dark);
        font-size: 0.82rem;
        font-weight: 900;
        text-align: center;
      }

      .photo-box {
        position: relative;
        display: grid;
        min-height: 260px;
        overflow: hidden;
        place-items: center;
        border: 2px dashed #a9cffc;
        border-radius: 24px;
        background: #f7fbff;
      }

      .photo-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .photo-box span {
        display: grid;
        place-items: center;
        gap: 8px;
        color: var(--muted);
        font-weight: 850;
      }

      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .switch-line {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        align-items: center;
        color: var(--muted);
        font-weight: 850;
      }

      .switch-line input {
        width: 22px;
        height: 22px;
      }

      .swatches {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }

      .swatch {
        min-height: 46px;
        border: 3px solid white;
        border-radius: 16px;
        box-shadow: 0 8px 14px rgba(14, 36, 64, 0.12);
      }

      .swatch.active {
        outline: 3px solid var(--ink);
      }

      .range-row {
        display: grid;
        gap: 8px;
      }

      input[type="range"] {
        padding: 0;
      }

      .bottom-nav {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        width: min(540px, 100%);
        margin: 0 auto;
        padding: 8px 10px 10px;
        border-top: 1px solid rgba(216, 232, 251, 0.9);
        border-radius: 24px 24px 0 0;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 -14px 30px rgba(14, 36, 64, 0.14);
        backdrop-filter: blur(16px);
      }

      .nav-btn {
        display: grid;
        min-height: 58px;
        place-items: center;
        gap: 2px;
        border-radius: 18px;
        background: transparent;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 900;
      }

      .nav-btn span {
        font-size: 1.35rem;
        line-height: 1;
      }

      .nav-btn.active {
        background: linear-gradient(135deg, var(--blue), var(--cyan));
        color: white;
        box-shadow: 0 10px 20px rgba(22, 119, 255, 0.22);
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 390px) {
        :root {
          --slot-size: 68px;
        }

        .brand-title {
          font-size: 1.5rem;
        }

        .showcase {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <button class="avatar" id="avatarButton" type="button" title="Avatar wechseln">🎒</button>
        <div>
          <h1 class="brand-title">RealLife</h1>
          <p class="brand-sub" id="playerLine">Level 1 · 0 Sachen</p>
        </div>
        <div class="coin"><span>⭐</span><span id="scoreText">0</span></div>
      </header>

      <section class="screen active" id="inventoryScreen">
        <div class="panel toolbar">
          <div class="search-row">
            <input id="searchInput" type="search" placeholder="Suchen" autocomplete="off" />
            <button class="icon-btn" id="customizeButton" type="button" title="Anpassen">⚙</button>
          </div>
          <div class="category-row" id="categoryRow"></div>
        </div>

        <div class="panel inventory-shell">
          <div class="tabs">
            <button class="tab-pill active" type="button" data-filter="all">
              <span>📦</span><span>Meine Sachen</span>
            </button>
            <button class="tab-pill" type="button" data-filter="favorite">
              <span>⭐</span><span>Liebling</span>
            </button>
          </div>
          <div class="grid" id="itemGrid"></div>
          <div class="empty-note hidden" id="emptyNote">
            <strong>🎮</strong>
            <p>Noch leer. Mit Foto kommt dein erstes Item rein.</p>
            <button class="primary" type="button" data-nav="photo">Item anlegen</button>
          </div>
        </div>
      </section>

      <section class="screen" id="museumScreen">
        <div class="panel museum-stage">
          <div class="tabs">
            <button class="tab-pill active" type="button">
              <span>🏆</span><span>Museum</span>
            </button>
            <button class="tab-pill" id="museumStyleButton" type="button">
              <span>✨</span><span>Style</span>
            </button>
          </div>
          <div class="showcase" id="museumGrid"></div>
          <div class="empty-note hidden" id="museumEmpty">
            <strong>⭐</strong>
            <p>Markiere Lieblingssachen. Dann landen sie hier.</p>
          </div>
        </div>
      </section>

      <section class="screen" id="photoScreen">
        <form class="panel form" id="itemForm">
          <div class="form-head">
            <strong id="formTitle">Neues Item</strong>
            <button class="icon-btn hidden" id="cancelEditButton" type="button" title="Bearbeiten abbrechen">↩</button>
          </div>
          <div class="photo-box" id="photoBox">
            <span><strong style="font-size: 3rem">📷</strong>Foto oder Symbol</span>
            <img class="hidden" id="previewImage" alt="Item Foto" />
          </div>
          <input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden" />
          <button class="primary" id="photoButton" type="button">Foto waehlen</button>

          <input id="nameInput" required maxlength="28" placeholder="Name vom Item" />
          <div class="two-col">
            <select id="categoryInput"></select>
            <input id="amountInput" type="number" min="1" value="1" aria-label="Anzahl" />
          </div>
          <div class="two-col">
            <input id="dateInput" type="month" aria-label="Seit wann" />
            <select id="rarityInput" aria-label="Seltenheit">
              <option value="Normal">Normal</option>
              <option value="Cool">Cool</option>
              <option value="Selten">Selten</option>
              <option value="Ultra">Ultra</option>
            </select>
          </div>
          <textarea id="noteInput" rows="2" maxlength="90" placeholder="Kurze Info"></textarea>
          <label class="switch-line">
            <input id="favoriteInput" type="checkbox" />
            <span>Ins Museum stellen</span>
          </label>
          <div class="form-actions">
            <button type="button" id="clearFormButton">Leeren</button>
            <button class="primary" id="submitItemButton" type="submit">Speichern</button>
          </div>
        </form>
      </section>

      <section class="screen" id="searchScreen">
        <div class="panel toolbar">
          <input id="bigSearchInput" type="search" placeholder="Was suchst du?" autocomplete="off" />
        </div>
        <div class="panel inventory-shell">
          <div class="grid" id="searchGrid"></div>
        </div>
      </section>

      <section class="screen" id="customizeScreen">
        <div class="panel customizer">
          <div class="tabs">
            <button class="tab-pill active" type="button">
              <span>🎨</span><span>Anpassen</span>
            </button>
            <button class="tab-pill" id="addDemoButton" type="button">
              <span>🎁</span><span>Demo</span>
            </button>
          </div>
          <input id="nicknameInput" maxlength="18" placeholder="Name" />
          <select id="avatarInput" aria-label="Avatar">
            <option value="🎒">Rucksack</option>
            <option value="🎮">Controller</option>
            <option value="🛹">Skateboard</option>
            <option value="📚">Buecher</option>
            <option value="⭐">Stern</option>
          </select>
          <div class="swatches" id="swatches"></div>
          <label class="range-row">
            <strong>Slot Groesse</strong>
            <input id="slotSizeInput" type="range" min="62" max="96" value="78" />
          </label>
          <select id="slotStyleInput" aria-label="Slot Style">
            <option value="soft">Soft</option>
            <option value="arcade">Arcade</option>
            <option value="clean">Clean</option>
          </select>
        </div>
      </section>

      <article class="detail-card" id="detailCard"></article>
    </main>

    <nav class="bottom-nav" aria-label="Navigation">
      <button class="nav-btn active" type="button" data-nav="inventory"><span>🎒</span>Inventar</button>
      <button class="nav-btn" type="button" data-nav="museum"><span>🏆</span>Museum</button>
      <button class="nav-btn" type="button" data-nav="photo"><span>📷</span>Foto</button>
      <button class="nav-btn" type="button" data-nav="search"><span>🔎</span>Suche</button>
    </nav>

    <script>
      const STORAGE_KEY = "reallife-game-inventory-v2";
      const STYLE_KEY = "reallife-game-style-v1";
      const categories = [
        { id: "all", label: "Alle", icon: "▦" },
        { id: "lifestyle", label: "Style", icon: "👕" },
        { id: "tech", label: "Tech", icon: "🎮" },
        { id: "school", label: "Schule", icon: "📘" },
        { id: "fun", label: "Freizeit", icon: "🛹" },
        { id: "collect", label: "Sammeln", icon: "🃏" },
        { id: "other", label: "Anderes", icon: "📦" }
      ];
      const colors = [
        { name: "Blau", value: "#1677ff", dark: "#0658d8", cyan: "#49bfff" },
        { name: "Gruen", value: "#16a86d", dark: "#08764c", cyan: "#65d6a3" },
        { name: "Orange", value: "#ff8a1f", dark: "#cc6200", cyan: "#ffc24c" },
        { name: "Rot", value: "#ed4f62", dark: "#b92739", cyan: "#ff8a96" },
        { name: "Schwarz", value: "#1d2a3a", dark: "#0b1320", cyan: "#6da9ff" }
      ];
      const demoItems = [
        itemSeed("Skateboard", "fun", "🛹", "Selten", "Mein Board fuer draussen.", true),
        itemSeed("Controller", "tech", "🎮", "Cool", "Lieblingscontroller.", false),
        itemSeed("Hoodie", "lifestyle", "👕", "Normal", "Blauer Hoodie.", true),
        itemSeed("Trading Card", "collect", "🃏", "Ultra", "Glitzerkarte.", true),
        itemSeed("Notizbuch", "school", "📘", "Normal", "Schule und Ideen.", false),
        itemSeed("Sneaker", "lifestyle", "👟", "Cool", "Saubere Schuhe.", false)
      ];

      let items = loadItems();
      let selectedId = null;
      let editingId = null;
      let activeCategory = "all";
      let activeFilter = "all";
      let currentPhoto = "";
      let settings = loadSettings();

      const screens = {
        inventory: document.querySelector("#inventoryScreen"),
        museum: document.querySelector("#museumScreen"),
        photo: document.querySelector("#photoScreen"),
        search: document.querySelector("#searchScreen"),
        customize: document.querySelector("#customizeScreen")
      };
      const itemGrid = document.querySelector("#itemGrid");
      const searchGrid = document.querySelector("#searchGrid");
      const museumGrid = document.querySelector("#museumGrid");
      const emptyNote = document.querySelector("#emptyNote");
      const museumEmpty = document.querySelector("#museumEmpty");
      const detailCard = document.querySelector("#detailCard");
      const searchInput = document.querySelector("#searchInput");
      const bigSearchInput = document.querySelector("#bigSearchInput");
      const categoryRow = document.querySelector("#categoryRow");
      const categoryInput = document.querySelector("#categoryInput");
      const photoInput = document.querySelector("#photoInput");
      const previewImage = document.querySelector("#previewImage");
      const photoBox = document.querySelector("#photoBox");
      const itemForm = document.querySelector("#itemForm");
      const formTitle = document.querySelector("#formTitle");
      const submitItemButton = document.querySelector("#submitItemButton");
      const cancelEditButton = document.querySelector("#cancelEditButton");

      function itemSeed(name, category, icon, rarity, note, favorite) {
        return {
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
          name,
          category,
          icon,
          rarity,
          note,
          favorite,
          amount: 1,
          date: "2026-08",
          photo: ""
        };
      }

      function loadItems() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch {
          return [];
        }
      }

      function loadSettings() {
        const fallback = {
          nickname: "",
          avatar: "🎒",
          color: "#1677ff",
          slotSize: 78,
          slotStyle: "soft"
        };
        try {
          return { ...fallback, ...(JSON.parse(localStorage.getItem(STYLE_KEY)) || {}) };
        } catch {
          return fallback;
        }
      }

      function saveItems() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      }

      function saveSettings() {
        localStorage.setItem(STYLE_KEY, JSON.stringify(settings));
      }

      function applySettings() {
        const color = colors.find((entry) => entry.value === settings.color) || colors[0];
        document.documentElement.style.setProperty("--blue", color.value);
        document.documentElement.style.setProperty("--blue-dark", color.dark);
        document.documentElement.style.setProperty("--cyan", color.cyan);
        document.documentElement.style.setProperty("--slot-size", `${settings.slotSize}px`);
        document.querySelector("#avatarButton").textContent = settings.avatar;
        document.querySelector("#nicknameInput").value = settings.nickname;
        document.querySelector("#avatarInput").value = settings.avatar;
        document.querySelector("#slotSizeInput").value = settings.slotSize;
        document.querySelector("#slotStyleInput").value = settings.slotStyle;
        document.body.dataset.slotStyle = settings.slotStyle;
        renderSwatches();
      }

      function categoryName(id) {
        return categories.find((category) => category.id === id)?.label || "Anderes";
      }

      function filteredItems(querySource = searchInput) {
        const term = querySource.value.trim().toLowerCase();
        return items.filter((item) => {
          const byCategory = activeCategory === "all" || item.category === activeCategory;
          const byFilter = activeFilter === "all" || item.favorite;
          const byText = !term || `${item.name} ${item.note} ${categoryName(item.category)}`.toLowerCase().includes(term);
          return byCategory && byFilter && byText;
        });
      }

      function renderCategories() {
        categoryRow.innerHTML = categories
          .map((category) => `
            <button class="chip ${category.id === activeCategory ? "active" : ""}" type="button" data-category="${category.id}">
              <strong>${category.icon}</strong>
              <span>${category.label}</span>
            </button>
          `)
          .join("");
        categoryInput.innerHTML = categories
          .filter((category) => category.id !== "all")
          .map((category) => `<option value="${category.id}">${category.label}</option>`)
          .join("");
      }

      function slotMarkup(item, extraClass = "") {
        if (!item) return `<button class="slot empty ${extraClass}" type="button" data-nav="photo">+</button>`;
        const art = item.photo
          ? `<img class="slot-photo" src="${item.photo}" alt="${escapeHtml(item.name)}" />`
          : `<span class="slot-icon">${item.icon || "📦"}</span>`;
        return `
          <button class="slot ${selectedId === item.id ? "selected" : ""} ${extraClass}" type="button" data-item="${item.id}">
            ${art}
            ${item.favorite ? `<span class="star">★</span>` : ""}
            ${item.amount > 1 ? `<span class="count">x${item.amount}</span>` : ""}
          </button>
        `;
      }

      function renderInventory() {
        const shown = filteredItems(searchInput);
        itemGrid.innerHTML = shown.map((item) => slotMarkup(item)).join("");
        const emptySlots = Math.max(12 - shown.length, shown.length ? 0 : 8);
        itemGrid.insertAdjacentHTML("beforeend", Array.from({ length: emptySlots }, () => slotMarkup()).join(""));
        emptyNote.classList.toggle("hidden", items.length !== 0 || Boolean(searchInput.value.trim()));
        document.querySelector("#scoreText").textContent = String(items.filter((item) => item.favorite).length * 100 + items.length * 10);
        document.querySelector("#playerLine").textContent = `${settings.nickname || "Level 1"} · ${items.length} Sachen`;
      }

      function renderMuseum() {
        const favorites = items.filter((item) => item.favorite);
        museumGrid.innerHTML = favorites
          .map((item) => `
            <button class="pedestal" type="button" data-item="${item.id}">
              ${slotMarkup(item, "museum-slot")}
              <div class="pedestal-name">${escapeHtml(item.name)}</div>
            </button>
          `)
          .join("");
        museumEmpty.classList.toggle("hidden", favorites.length !== 0);
      }

      function renderSearch() {
        const term = bigSearchInput.value.trim().toLowerCase();
        const found = items.filter((item) =>
          `${item.name} ${item.note} ${categoryName(item.category)}`.toLowerCase().includes(term)
        );
        searchGrid.innerHTML = found.map((item) => slotMarkup(item)).join("");
      }

      function renderSwatches() {
        document.querySelector("#swatches").innerHTML = colors
          .map((color) => `
            <button
              class="swatch ${settings.color === color.value ? "active" : ""}"
              type="button"
              data-color="${color.value}"
              title="${color.name}"
              style="background: linear-gradient(135deg, ${color.value}, ${color.cyan})"
            ></button>
          `)
          .join("");
      }

      function renderDetail() {
        const item = items.find((entry) => entry.id === selectedId);
        if (!item) {
          detailCard.classList.remove("show");
          detailCard.innerHTML = "";
          return;
        }
        const art = item.photo
          ? `<img src="${item.photo}" alt="${escapeHtml(item.name)}" />`
          : `<span>${item.icon || "📦"}</span>`;
        detailCard.innerHTML = `
          <div class="detail-art">${art}</div>
          <div>
            <h2>${escapeHtml(item.name)}</h2>
            <p>${categoryName(item.category)} · ${item.rarity} · x${item.amount}</p>
            <p>${escapeHtml(item.note || "Keine Info")}</p>
          </div>
          <div class="detail-actions">
            <button class="icon-btn" type="button" data-action="edit">✎</button>
            <button class="icon-btn" type="button" data-action="favorite">${item.favorite ? "★" : "☆"}</button>
            <button class="icon-btn" type="button" data-action="delete">✕</button>
          </div>
        `;
        detailCard.classList.add("show");
      }

      function renderAll() {
        renderCategories();
        applySettings();
        renderInventory();
        renderMuseum();
        renderSearch();
        renderDetail();
      }

      function selectItem(id) {
        selectedId = id;
        renderAll();
      }

      function resetItemForm() {
        editingId = null;
        itemForm.reset();
        document.querySelector("#amountInput").value = "1";
        document.querySelector("#rarityInput").value = "Normal";
        currentPhoto = "";
        previewImage.removeAttribute("src");
        previewImage.classList.add("hidden");
        photoBox.querySelector("span").classList.remove("hidden");
        formTitle.textContent = "Neues Item";
        submitItemButton.textContent = "Speichern";
        cancelEditButton.classList.add("hidden");
      }

      function startEditItem(id) {
        const item = items.find((entry) => entry.id === id);
        if (!item) return;
        editingId = id;
        selectedId = id;
        document.querySelector("#nameInput").value = item.name;
        document.querySelector("#categoryInput").value = item.category;
        document.querySelector("#amountInput").value = item.amount;
        document.querySelector("#dateInput").value = item.date || "";
        document.querySelector("#rarityInput").value = item.rarity;
        document.querySelector("#noteInput").value = item.note || "";
        document.querySelector("#favoriteInput").checked = item.favorite;
        currentPhoto = item.photo || "";
        if (currentPhoto) {
          previewImage.src = currentPhoto;
          previewImage.classList.remove("hidden");
          photoBox.querySelector("span").classList.add("hidden");
        } else {
          previewImage.removeAttribute("src");
          previewImage.classList.add("hidden");
          photoBox.querySelector("span").classList.remove("hidden");
        }
        formTitle.textContent = "Item bearbeiten";
        submitItemButton.textContent = "Update";
        cancelEditButton.classList.remove("hidden");
        showScreen("photo");
      }

      function showScreen(name) {
        Object.entries(screens).forEach(([key, screen]) => {
          screen.classList.toggle("active", key === name);
        });
        document.querySelectorAll(".nav-btn").forEach((button) => {
          button.classList.toggle("active", button.dataset.nav === name);
        });
        if (name === "photo" && !editingId) {
          resetItemForm();
        }
        if (name !== "inventory" && name !== "museum" && name !== "search" && !editingId) {
          selectedId = null;
          renderDetail();
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      document.addEventListener("click", (event) => {
        const nav = event.target.closest("[data-nav]");
        if (nav) {
          if (nav.dataset.nav === "photo") resetItemForm();
          showScreen(nav.dataset.nav);
          return;
        }

        const category = event.target.closest("[data-category]");
        if (category) {
          activeCategory = category.dataset.category;
          renderAll();
          return;
        }

        const filter = event.target.closest("[data-filter]");
        if (filter) {
          activeFilter = filter.dataset.filter;
          document.querySelectorAll("[data-filter]").forEach((button) => {
            button.classList.toggle("active", button === filter);
          });
          renderInventory();
          return;
        }

        const action = event.target.closest("[data-action]");
        if (action && selectedId) {
          if (action.dataset.action === "edit") {
            startEditItem(selectedId);
            return;
          }
          if (action.dataset.action === "favorite") {
            items = items.map((item) => item.id === selectedId ? { ...item, favorite: !item.favorite } : item);
          }
          if (action.dataset.action === "delete") {
            items = items.filter((item) => item.id !== selectedId);
            selectedId = null;
          }
          saveItems();
          renderAll();
          return;
        }

        const itemButton = event.target.closest("[data-item]");
        if (itemButton) {
          selectItem(itemButton.dataset.item);
          return;
        }

        const color = event.target.closest("[data-color]");
        if (color) {
          settings.color = color.dataset.color;
          saveSettings();
          applySettings();
        }
      });

      document.querySelector("#customizeButton").addEventListener("click", () => showScreen("customize"));
      document.querySelector("#museumStyleButton").addEventListener("click", () => showScreen("customize"));
      document.querySelector("#photoButton").addEventListener("click", () => photoInput.click());
      document.querySelector("#avatarButton").addEventListener("click", () => showScreen("customize"));
      cancelEditButton.addEventListener("click", () => {
        resetItemForm();
        showScreen("inventory");
      });
      document.querySelector("#clearFormButton").addEventListener("click", resetItemForm);

      searchInput.addEventListener("input", renderInventory);
      bigSearchInput.addEventListener("input", renderSearch);
      document.querySelector("#nicknameInput").addEventListener("input", (event) => {
        settings.nickname = event.target.value.trim();
        saveSettings();
        renderAll();
      });
      document.querySelector("#avatarInput").addEventListener("change", (event) => {
        settings.avatar = event.target.value;
        saveSettings();
        applySettings();
      });
      document.querySelector("#slotSizeInput").addEventListener("input", (event) => {
        settings.slotSize = Number(event.target.value);
        saveSettings();
        applySettings();
      });
      document.querySelector("#slotStyleInput").addEventListener("change", (event) => {
        settings.slotStyle = event.target.value;
        saveSettings();
        applySettings();
      });

      photoInput.addEventListener("change", () => {
        const file = photoInput.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          currentPhoto = String(reader.result);
          previewImage.src = currentPhoto;
          previewImage.classList.remove("hidden");
          photoBox.querySelector("span").classList.add("hidden");
        };
        reader.readAsDataURL(file);
      });

      document.querySelector("#itemForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const original = items.find((item) => item.id === editingId);
        const formItem = {
          ...(original || {}),
          id: editingId || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
          name: document.querySelector("#nameInput").value.trim(),
          category: document.querySelector("#categoryInput").value,
          amount: Math.max(1, Number(document.querySelector("#amountInput").value || 1)),
          date: document.querySelector("#dateInput").value || "",
          rarity: document.querySelector("#rarityInput").value,
          note: document.querySelector("#noteInput").value.trim(),
          favorite: document.querySelector("#favoriteInput").checked,
          photo: currentPhoto,
          icon: original?.icon || "📦"
        };
        items = editingId
          ? items.map((item) => item.id === editingId ? formItem : item)
          : [formItem, ...items];
        saveItems();
        selectedId = formItem.id;
        resetItemForm();
        selectedId = formItem.id;
        renderAll();
        showScreen("inventory");
      });

      document.querySelector("#addDemoButton").addEventListener("click", () => {
        items = demoItems.map((item) => ({
          ...item,
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())
        }));
        saveItems();
        selectedId = items[0]?.id || null;
        renderAll();
        showScreen("inventory");
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }

      renderAll();
    </script>
  </body>
</html>
